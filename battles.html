<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif Ludo - Battles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f6f9fe;color:#1e293b;padding-bottom:30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);position:sticky;top:0;z-index:100}
.header-left,.header-right{display:flex;align-items:center;gap:8px}
.back-btn{background:#f1f5f9;border:1px solid #cbd5e1;width:36px;height:36px;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer}
.chip{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800;border:none;cursor:pointer}
.chip-w{background:#10b981;color:#fff}.chip-c{background:#f97316;color:#fff}

.container{padding:16px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Set Amount Box */
.set-box{background:#fff;border-radius:18px;padding:10px 12px;border:1px solid #e2e8f0;display:flex;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.amt-input{flex:1;border:none;background:#f8fafc;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;outline:none}
.btn-set{background:#0284c7;color:#fff;border:none;padding:0 24px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer}

.sec-title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#0f172a;margin-top:6px}
.empty-box{background:#fff;border:1px dashed #cbd5e1;border-radius:16px;padding:24px 16px;text-align:center;color:#64748b;font-size:13px;font-weight:700}

/* Battle Cards */
.battle-card{background:#fff;border-radius:20px;padding:14px 16px;border:1px solid #e2e8f0;box-shadow:0 3px 12px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:10px}
.b-top{display:flex;justify-content:space-between;align-items:center}
.badge-open{background:#e0f2fe;color:#0284c7;font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px}
.b-creator{font-size:11px;font-weight:800;color:#64748b}
.b-mid{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.b-col{display:flex;flex-direction:column}
.b-lbl{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase}
.b-val{font-size:18px;font-weight:900;color:#0f172a}
.b-sep{width:1px;height:24px;background:#e2e8f0}
.btn-cancel-sm{background:#fee2e2;color:#ef4444;border:none;padding:8px 18px;border-radius:16px;font-size:12px;font-weight:800;cursor:pointer;align-self:flex-end}

/* पॉप-अप विंडो (Low Balance Modal) */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);z-index:999;display:none;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;width:100%;max-width:340px;border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,0.25);animation:popIn 0.2s ease-out}
@keyframes popIn{from{transform:scale(0.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-icon{font-size:42px;margin-bottom:10px}
.modal-title{font-size:19px;font-weight:900;color:#0f172a;margin-bottom:8px}
.modal-desc{font-size:13px;color:#64748b;line-height:1.5;margin-bottom:20px}
.modal-btn-row{display:flex;gap:10px}
.btn-modal-close{flex:1;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;padding:12px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.btn-modal-ok{flex:1.4;background:#0284c7;color:#fff;border:none;padding:12px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(2,132,199,0.35)}
</style>
</head>
<body>

<!-- पॉप-अप विंडो -->
<div class="modal-overlay" id="lowBalModal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">अपर्याप्त बैलेंस!</div>
    <div class="modal-desc" id="modal-desc-text">
      आपके वॉलेट में पर्याप्त बैलेंस नहीं है।<br>बैटल सेट करने के लिए कृपया पहले अमाउंट डिपॉजिट करें।
    </div>
    <div class="modal-btn-row">
      <button class="btn-modal-close" onclick="closeModal()">रद्द करें</button>
      <button class="btn-modal-ok" onclick="goToDeposit()">ओके</button>
    </div>
  </div>
</div>

<header class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='home.html'">❮</button>
    <img src="logo.png" style="height:32px" onerror="this.style.display='none'">
  </div>
  <div class="header-right">
    <button class="chip chip-w" onclick="goToDeposit()">₹ <span id="w-bal">0</span></button>
    <button class="chip chip-c">🪙 <span id="c-bal">0</span></button>
  </div>
</header>

<div class="container">

  <!-- सेट अमाउंट बॉक्स -->
  <div class="set-box">
    <input type="number" id="battle-amt" class="amt-input" placeholder="Enter Amount (50, 100...)" step="50">
    <button class="btn-set" onclick="setNewBattle()">SET</button>
  </div>

  <!-- ओपन बैटल सेक्शन -->
  <div class="sec-title">⚔️ Open Battles</div>
  <div id="open-battles-list" style="display:flex;flex-direction:column;gap:10px">
    <div id="no-open-msg" class="empty-box">
      फिलहाल कोई ओपन बैटल नहीं है।<br>ऊपर अमाउंट डालकर अपनी बैटल सेट करें!
    </div>
  </div>

  <!-- रनिंग बैटल सेक्शन -->
  <div class="sec-title" style="margin-top:10px">🔥 Running Battles</div>
  <div id="running-battles-list" style="display:flex;flex-direction:column;gap:10px">
    <div id="no-running-msg" class="empty-box">
      फिलहाल कोई मैच चालू नहीं है।
    </div>
  </div>

</div>

<script>
function refreshWalletUI() {
  var bal = localStorage.getItem("main_balance") || "0";
  var ref = localStorage.getItem("ref_balance") || "0";
  document.getElementById("w-bal").innerText = bal;
  document.getElementById("c-bal").innerText = ref;
}

window.onload = function() {
  refreshWalletUI();
};

function setNewBattle() {
  var amtInput = document.getElementById("battle-amt");
  var amt = parseInt(amtInput.value);

  // 1. अमाउंट की जांच (कम से कम ₹50 और 50 के गुणज में)
  if (isNaN(amt) || amt < 50 || amt % 50 !== 0) {
    alert("⚠️ कृपया 50 के मल्टीपल में अमाउंट दर्ज करें (जैसे ₹50, ₹100, ₹150, ₹200...)");
    return;
  }

  // 2. बैलेंस की जांच - कम होने पर पॉप-अप दिखाना
  var currentBal = parseInt(localStorage.getItem("main_balance") || "0");
  if (currentBal < amt) {
    document.getElementById("modal-desc-text").innerHTML = 
      "आपके वॉलेट में केवल <b>₹" + currentBal + "</b> हैं।<br>₹" + amt + " का बैटल लगाने के लिए कृपया पहले अमाउंट डिपॉजिट करें।";
    document.getElementById("lowBalModal").style.display = "flex";
    return;
  }

  // 3. पहले से कोई बैटल पेंडिंग तो नहीं
  if(document.getElementById("my-battle-card")) {
    alert("⚠️ आपकी एक बैटल पहले से पेंडिंग है। नया बैटल लगाने से पहले पुरानी बैटल को कैंसिल करें।");
    return;
  }

  // 4. बैलेंस से कटौती
  currentBal -= amt;
  localStorage.setItem("main_balance", currentBal);
  localStorage.setItem("active_battle_amt", amt);
  refreshWalletUI();

  var myName = (localStorage.getItem("user_name") || "PLAYER").toUpperCase();
  var prize = Math.round((amt * 2) * 0.95);

  var emptyMsg = document.getElementById("no-open-msg");
  if(emptyMsg) emptyMsg.style.display = "none";

  var newCard = document.createElement("div");
  newCard.className = "battle-card";
  newCard.id = "my-battle-card";
  newCard.innerHTML = `
    <div class="b-top">
      <span class="badge-open" style="background:#fef08a;color:#854d0e">WAITING</span>
      <span class="b-creator">FROM ${myName} (YOU)</span>
    </div>
    <div class="b-mid">
      <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹${amt}</span></div>
      <div class="b-sep"></div>
      <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹${prize}</span></div>
    </div>
    <button class="btn-cancel-sm" onclick="cancelMyBattle()">Cancel Battle</button>
  `;

  var list = document.getElementById("open-battles-list");
  list.insertBefore(newCard, list.firstChild);

  amtInput.value = "";
  alert("✅ आपका ₹" + amt + " का बैटल सेट हो गया है!");
}

function cancelMyBattle() {
  var myCard = document.getElementById("my-battle-card");
  if(myCard) {
    myCard.remove();
    var emptyMsg = document.getElementById("no-open-msg");
    if(emptyMsg) emptyMsg.style.display = "block";

    var refundAmt = parseInt(localStorage.getItem("active_battle_amt") || "0");
    var currentBal = parseInt(localStorage.getItem("main_balance") || "0");
    currentBal += refundAmt;
    localStorage.setItem("main_balance", currentBal);
    localStorage.removeItem("active_battle_amt");
    refreshWalletUI();

    alert("✅ बैटल कैंसिल कर दिया गया है! ₹" + refundAmt + " वापस आ गए हैं।");
  }
}

function closeModal() {
  document.getElementById("lowBalModal").style.display = "none";
}

// ओके बटन दबाने पर सीधे डिपॉजिट (Wallet) स्क्रीन पर जाना
function goToDeposit() {
  localStorage.setItem("open_tab", "wallet");
  window.location.href = "home.html?tab=wallet";
}
</script>
</body>
</html>
