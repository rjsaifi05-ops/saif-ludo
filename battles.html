<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif Ludo - Battles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f6f9fe;color:#1e293b;padding-bottom:30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.04);position:sticky;top:0;z-index:100}
.header-left,.header-right{display:flex;align-items:center;gap:8px}
.back-btn{background:#f1f5f9;border:1px solid #cbd5e1;width:36px;height:36px;border-radius:10px;font-size:18px;font-weight:900;cursor:pointer}
.chip{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800;border:none}
.chip-w{background:#10b981;color:#fff}.chip-c{background:#f97316;color:#fff}

.container{padding:16px;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* Set Amount Box */
.set-box{background:#fff;border-radius:18px;padding:10px 12px;border:1px solid #e2e8f0;display:flex;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.02)}
.amt-input{flex:1;border:none;background:#f8fafc;padding:12px 16px;border-radius:12px;font-size:15px;font-weight:700;outline:none}
.btn-set{background:#0284c7;color:#fff;border:none;padding:0 24px;border-radius:12px;font-weight:900;font-size:14px;cursor:pointer}

.sec-title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:900;color:#0f172a;margin-top:6px}

/* Battle Cards */
.battle-card{background:#fff;border-radius:20px;padding:14px 16px;border:1px solid #e2e8f0;box-shadow:0 3px 12px rgba(0,0,0,.03);display:flex;flex-direction:column;gap:10px}
.b-top{display:flex;justify-content:space-between;align-items:center}
.badge-open{background:#e0f2fe;color:#0284c7;font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.badge-live{background:#dcfce7;color:#16a34a;font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;letter-spacing:.5px}
.b-creator{font-size:11px;font-weight:800;color:#64748b}

.b-mid{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.b-col{display:flex;flex-direction:column}
.b-lbl{font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase}
.b-val{font-size:18px;font-weight:900;color:#0f172a}
.b-sep{width:1px;height:24px;background:#e2e8f0}

.btn-play-sm{background:#0284c7;color:#fff;border:none;padding:7px 22px;border-radius:16px;font-size:13px;font-weight:900;cursor:pointer;align-self:flex-end}
.btn-cancel-sm{background:#fee2e2;color:#ef4444;border:none;padding:7px 16px;border-radius:16px;font-size:12px;font-weight:800;cursor:pointer;align-self:flex-end}

/* Running Battle Players */
.vs-row{display:flex;justify-content:space-between;align-items:center;padding-top:6px;border-top:1px dashed #e2e8f0;font-size:12px;font-weight:800;color:#334155}
.vs-circle{background:#0284c7;color:#fff;font-size:10px;padding:3px 6px;border-radius:50%;font-weight:900}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='home.html'">❮</button>
    <img src="logo.png" style="height:32px" onerror="this.style.display='none'">
  </div>
  <div class="header-right">
    <button class="chip chip-w">₹ <span id="w-bal">0</span></button>
    <button class="chip chip-c">🪙 <span id="c-bal">0</span></button>
  </div>
</header>

<div class="container">

  <!-- सेट अमाउंट बॉक्स -->
  <div class="set-box">
    <input type="number" id="battle-amt" class="amt-input" placeholder="Enter Amount (50, 100...)" step="50">
    <button class="btn-set" onclick="setNewBattle()">SET</button>
  </div>

  <!-- ओपन बैटल सेक्शन -->
  <div class="sec-title">⚔️ Open Battles</div>
  <div id="open-battles-list" style="display:flex;flex-direction:column;gap:10px">
    
    <!-- डेमो ओपन बैटल्स -->
    <div class="battle-card">
      <div class="b-top">
        <span class="badge-open">OPEN</span>
        <span class="b-creator">FROM SANTOSH MEENA</span>
      </div>
      <div class="b-mid">
        <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹250</span></div>
        <div class="b-sep"></div>
        <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹475</span></div>
      </div>
      <button class="btn-play-sm" onclick="joinBattle('SANTOSH MEENA', 250, 475)">Play</button>
    </div>

    <div class="battle-card">
      <div class="b-top">
        <span class="badge-open">OPEN</span>
        <span class="b-creator">FROM AKASH KUMAR</span>
      </div>
      <div class="b-mid">
        <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹500</span></div>
        <div class="b-sep"></div>
        <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹950</span></div>
      </div>
      <button class="btn-play-sm" onclick="joinBattle('AKASH KUMAR', 500, 950)">Play</button>
    </div>

  </div>

  <!-- रनिंग बैटल सेक्शन -->
  <div class="sec-title" style="margin-top:10px">🔥 Running Battles</div>
  <div style="display:flex;flex-direction:column;gap:10px">

    <div class="battle-card">
      <div class="b-top">
        <span class="badge-live">● LIVE</span>
        <span class="b-creator">MATCH IN PROGRESS</span>
      </div>
      <div class="b-mid">
        <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹500</span></div>
        <div class="b-sep"></div>
        <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹950</span></div>
      </div>
      <div class="vs-row">
        <span>👤 Rajesh Sarma</span>
        <span class="vs-circle">VS</span>
        <span>👤 Prem Singh</span>
      </div>
    </div>

    <div class="battle-card">
      <div class="b-top">
        <span class="badge-live">● LIVE</span>
        <span class="b-creator">MATCH IN PROGRESS</span>
      </div>
      <div class="b-mid">
        <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹100</span></div>
        <div class="b-sep"></div>
        <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹190</span></div>
      </div>
      <div class="vs-row">
        <span>👤 Payal</span>
        <span class="vs-circle">VS</span>
        <span>👤 Jai Bajrangbali</span>
      </div>
    </div>

  </div>

</div>

<script>
window.onload = function() {
  document.getElementById("w-bal").innerText = localStorage.getItem("main_balance") || "0";
  document.getElementById("c-bal").innerText = localStorage.getItem("ref_balance") || "0";
};

function setNewBattle() {
  var amtInput = document.getElementById("battle-amt");
  var amt = parseInt(amtInput.value);

  if (isNaN(amt) || amt < 50 || amt % 50 !== 0) {
    alert("⚠️ कृपया 50 के मल्टीपल में अमाउंट दर्ज करें (जैसे ₹50, ₹100, ₹150, ₹200...)");
    return;
  }

  var myName = (localStorage.getItem("user_name") || "PLAYER").toUpperCase();
  var prize = Math.round((amt * 2) * 0.95); // 5% प्लेटफॉर्म कमीशन

  var newCard = document.createElement("div");
  newCard.className = "battle-card";
  newCard.id = "my-battle-card";
  newCard.innerHTML = `
    <div class="b-top">
      <span class="badge-open" style="background:#fef08a;color:#854d0e">WAITING</span>
      <span class="b-creator">FROM ${myName} (YOU)</span>
    </div>
    <div class="b-mid">
      <div class="b-col"><span class="b-lbl">Entry</span><span class="b-val">₹${amt}</span></div>
      <div class="b-sep"></div>
      <div class="b-col" style="text-align:right"><span class="b-lbl">Prize</span><span class="b-val" style="color:#16a34a">₹${prize}</span></div>
    </div>
    <button class="btn-cancel-sm" onclick="cancelMyBattle()">Cancel Battle</button>
  `;

  var list = document.getElementById("open-battles-list");
  list.insertBefore(newCard, list.firstChild);

  amtInput.value = "";
  alert("✅ आपका ₹" + amt + " का बैटल सेट हो गया है! विरोधी प्लेयर के जुड़ने का इंतज़ार करें।");
}

function cancelMyBattle() {
  var myCard = document.getElementById("my-battle-card");
  if(myCard) {
    myCard.remove();
    alert("बैटल कैंसिल कर दिया गया है।");
  }
}

function joinBattle(creator, entry, prize) {
  if(confirm(creator + " के साथ ₹" + entry + " का मैच शुरू करना चाहते हैं? जीत की राशि ₹" + prize + " होगी।")) {
    alert("मैच स्वीकार कर लिया गया! (अगला रूम कोड पेज लोड हो रहा है...)");
  }
}
</script>
</body>
</html>
