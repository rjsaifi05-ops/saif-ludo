<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - गेमिंग पोर्टल</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- मोबाइल नंबर दर्ज करने का बॉक्स -->
    <div class="container" id="login-box">
        <h2>स्वागत है</h2>
        <p>लॉगिन करने के लिए अपना मोबाइल नंबर दर्ज करें</p>
        
        <input type="tel" id="phone" class="input-box" placeholder="मोबाइल नंबर (10 अंक)" maxlength="10">
        <button class="btn" onclick="sendOTP()">ओटीपी भेजें</button>
    </div>

    <!-- ओटीपी दर्ज करने का बॉक्स (शुरुआत में छुपा रहेगा) -->
    <div class="container" id="otp-box" style="display: none;">
        <h2>ओटीपी वेरिफाई करें</h2>
        <p>आपके नंबर पर भेजा गया 6 अंकों का कोड दर्ज करें</p>
        
        <input type="text" id="otp" class="input-box" placeholder="6-digit OTP" maxlength="6">
        <button class="btn" onclick="verifyOTP()">वेरिफाई और लॉगिन</button>
    </div>

    <script>
        function sendOTP() {
            var phone = document.getElementById("phone").value;
            if(phone.length === 10) {
                alert("ओटीपी भेज दिया गया है!");
                document.getElementById("login-box").style.display = "none";
                document.getElementById("otp-box").style.display = "block";
            } else {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
            }
        }

        function verifyOTP() {
            var otp = document.getElementById("otp").value;
            if(otp.length === 6) {
                alert("लॉगिन सफल रहा!");
                window.location.href = "home.html";
            } else {
                alert("कृपया वैध 6 अंकों का कोड दर्ज करें।");
            }
        }
    </script>

</body>
</html>
