<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif Ludo - Withdraw Cash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f4f8fd;color:#0f172a;padding-bottom:85px;overflow-x:hidden}

.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#ffffff;box-shadow:0 4px 15px rgba(2,132,199,0.06);position:sticky;top:0;z-index:100}
.header-left,.header-right{display:flex;align-items:center;gap:8px}
.back-btn{background:#f1f5f9;border:1px solid #cbd5e1;width:38px;height:38px;border-radius:12px;font-size:18px;font-weight:900;cursor:pointer;color:#0f172a}
.chip{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:800;border:none}
.chip-w{background:#10b981;color:#fff}.chip-c{background:#f97316;color:#fff}

.container{padding:16px;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* टॉप कार्ड */
.top-meta{margin-bottom:2px}
.sub-badge{font-size:11px;font-weight:800;letter-spacing:1px;color:#16a34a;text-transform:uppercase}
.main-title{font-size:26px;font-weight:900;color:#050b17;letter-spacing:-0.5px}

/* बैलेंस कार्ड */
.bal-card{background:linear-gradient(135deg,#064e3b,#047857);color:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 20px rgba(4,120,87,0.3)}
.bal-lbl{font-size:12px;font-weight:700;opacity:0.9}
.bal-val{font-size:32px;font-weight:900;margin-top:2px}

/* अमाउंट इनपुट */
.card{background:#ffffff;border-radius:22px;padding:18px;border:1.5px solid #e0e7ff;box-shadow:0 6px 18px rgba(0,0,0,0.03)}
.field-label{font-size:11px;font-weight:800;color:#64748b;letter-spacing:0.8px;margin-bottom:8px;text-transform:uppercase}
.input-wrap{display:flex;align-items:center;background:#f8fafc;border:2px solid #cbd5e1;border-radius:16px;padding:12px 14px}
.input-wrap:focus-within{border-color:#16a34a;background:#fff}
.curr-sym{width:36px;height:36px;background:#16a34a;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;margin-right:10px}
.num-input{border:none;background:transparent;font-size:22px;font-weight:900;outline:none;width:100%;color:#0f172a}
.chips-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.chip-btn{background:#f1f5f9;border:1px solid #cbd5e1;padding:10px;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer}

/* मेथड कार्ड्स */
.method-box{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:18px;padding:14px;margin-bottom:12px}
.method-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.method-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800}
.lock-tag{background:#fee2e2;color:#ef4444;font-size:10px;font-weight:900;padding:3px 8px;border-radius:6px;display:none}
.lock-tag.active{display:inline-block}

.form-input{width:100%;padding:11px 13px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:14px;font-weight:700;outline:none;margin-bottom:8px;background:#fff}
.form-input:disabled{background:#f1f5f9;color:#64748b;border-color:#e2e8f0;cursor:not-allowed}
.btn-save-lock{background:#0284c7;color:#fff;border:none;padding:9px 16px;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;width:100%}

/* 3D विड्रॉ बटन */
.btn-withdraw-main{background:linear-gradient(135deg,#16a34a,#15803d);color:#fff;border:none;padding:16px;border-radius:20px;font-size:17px;font-weight:900;cursor:pointer;width:100%;box-shadow:0 8px 20px rgba(22,163,74,0.35)}
.btn-withdraw-main:active{transform:scale(0.97)}

/* बॉटम नेव */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;background:#fff;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #e2e8f0;max-width:500px;margin:0 auto;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:#64748b;font-size:11px;font-weight:700;cursor:pointer;width:25%}
.nav-item.active{color:#16a34a}
.nav-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <button class="back-btn" onclick="window.location.href='home.html'">❮</button>
    <img src="logo.png" style="height:32px" onerror="this.style.display='none'">
  </div>
  <div class="header-right">
    <button class="chip chip-w">₹ <span id="w-bal">0</span></button>
    <button class="chip chip-c">🪙 <span id="c-bal">0</span></button>
  </div>
</header>

<div class="container">

  <div class="top-meta">
    <div class="sub-badge">WALLET</div>
    <h1 class="main-title">Withdraw Cash</h1>
  </div>

  <!-- वॉलेट बैलेंस कार्ड -->
  <div class="bal-card">
    <div class="bal-lbl">कुल उपलब्ध बैलेंस</div>
    <div class="bal-val">₹ <span id="avail-bal">0</span></div>
  </div>

  <!-- विड्रॉल अमाउंट बॉक्स -->
  <div class="card">
    <div class="field-label">WITHDRAWAL AMOUNT</div>
    <div class="input-wrap">
      <div class="curr-sym">₹</div>
      <input type="number" id="withdraw-amt" class="num-input" placeholder="Min: 100" min="100">
    </div>

    <div class="chips-row">
      <button class="chip-btn" onclick="setAmt(100)">₹100</button>
      <button class="chip-btn" onclick="setAmt(200)">₹200</button>
      <button class="chip-btn" onclick="setAmt(500)">₹500</button>
      <button class="chip-btn" onclick="setAmt(1000)">₹1000</button>
    </div>
  </div>

  <!-- भुगतान माध्यम (Permanent Lock System) -->
  <div class="card">
    <div class="field-label">विड्रॉल प्राप्त करने का माध्यम (एक बार डालकर लॉक करें)</div>
    <p style="font-size:12px;color:#ef4444;font-weight:700;margin-bottom:12px">
      ⚠️ ध्यान दें: जो डिटेल आप एक बार सेव कर देंगे वो दोबारा एडिट नहीं होगी।
    </p>

    <!-- 1. UPI ID ऑप्शन -->
    <div class="method-box">
      <div class="method-head">
        <label class="method-name">
          <input type="radio" name="payout_choice" value="UPI" id="radio-upi" checked> 📱 UPI ID
        </label>
        <span class="lock-tag" id="lock-upi-tag">🔒 LOCKED</span>
      </div>
      <input type="text" id="upi-val" class="form-input" placeholder="उदा. yourname@paytm">
      <button class="btn-save-lock" id="btn-lock-upi" onclick="lockField('UPI')">🔒 Save & Permanent Lock</button>
    </div>

    <!-- 2. बैंक अकाउंट ऑप्शन -->
    <div class="method-box">
      <div class="method-head">
        <label class="method-name">
          <input type="radio" name="payout_choice" value="BANK" id="radio-bank"> 🏦 Bank Account
        </label>
        <span class="lock-tag" id="lock-bank-tag">🔒 LOCKED</span>
      </div>
      <input type="text" id="bank-holder" class="form-input" placeholder="खाता धारक का नाम (Holder Name)">
      <input type="number" id="bank-acc" class="form-input" placeholder="अकाउंट नंबर (Account Number)">
      <input type="text" id="bank-ifsc" class="form-input" placeholder="IFSC कोड (उदा. SBIN0001234)">
      <button class="btn-save-lock" id="btn-lock-bank" onclick="lockField('BANK')">🔒 Save & Permanent Lock</button>
    </div>

    <!-- 3. QR कोड ऑप्शन -->
    <div class="method-box">
      <div class="method-head">
        <label class="method-name">
          <input type="radio" name="payout_choice" value="QR" id="radio-qr"> 📷 Payment QR Code
        </label>
        <span class="lock-tag" id="lock-qr-tag">🔒 LOCKED</span>
      </div>
      <input type="file" id="qr-file" accept="image/*" class="form-input">
      <img id="qr-preview" style="width:100%;max-height:160px;object-fit:contain;display:none;margin-bottom:8px;border-radius:10px" alt="Saved QR">
      <button class="btn-save-lock" id="btn-lock-qr" onclick="lockField('QR')">🔒 Save & Permanent Lock</button>
    </div>
  </div>

  <button class="btn-withdraw-main" onclick="submitWithdraw()">Request Withdrawal ➔</button>

</div>

<!-- बॉटम नेविगेशन बार -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="window.location.href='home.html'">
    <div class="nav-icon" style="background:#e0f2fe;color:#0284c7">🏠</div>
    <span>Home</span>
  </button>
  <button class="nav-item active">
    <div class="nav-icon" style="background:#dcfce7;color:#16a34a">👛</div>
    <span>Wallet</span>
  </button>
  <button class="nav-item" onclick="window.location.href='home.html'">
    <div class="nav-icon" style="background:#cffafe;color:#0891b2">🎧</div>
    <span>Support</span>
  </button>
  <button class="nav-item" onclick="window.location.href='home.html'">
    <div class="nav-icon" style="background:#ffedd5;color:#ea580c">👤</div>
    <span>Profile</span>
  </button>
</nav>

<script>
window.onload = function() {
  var bal = localStorage.getItem("main_balance") || "0";
  document.getElementById("w-bal").innerText = bal;
  document.getElementById("avail-bal").innerText = bal;
  document.getElementById("c-bal").innerText = localStorage.getItem("ref_balance") || "0";

  loadLockedDetails();
};

function setAmt(val) {
  document.getElementById("withdraw-amt").value = val;
}

// सेव और लॉक डिटेल्स लोड करना
function loadLockedDetails() {
  var savedData = JSON.parse(localStorage.getItem("permanent_payout_details") || "{}");

  // 1. UPI लॉक जांच
  if (savedData.upi) {
    var upiInput = document.getElementById("upi-val");
    upiInput.value = savedData.upi;
    upiInput.disabled = true;
    document.getElementById("btn-lock-upi").style.display = "none";
    document.getElementById("lock-upi-tag").classList.add("active");
  }

  // 2. बैंक अकाउंट लॉक जांच
  if (savedData.bank) {
    document.getElementById("bank-holder").value = savedData.bank.holder;
    document.getElementById("bank-holder").disabled = true;
    document.getElementById("bank-acc").value = savedData.bank.acc;
    document.getElementById("bank-acc").disabled = true;
    document.getElementById("bank-ifsc").value = savedData.bank.ifsc;
    document.getElementById("bank-ifsc").disabled = true;
    document.getElementById("btn-lock-bank").style.display = "none";
    document.getElementById("lock-bank-tag").classList.add("active");
  }

  // 3. QR कोड लॉक जांच
  if (savedData.qr) {
    document.getElementById("qr-file").style.display = "none";
    var img = document.getElementById("qr-preview");
    img.src = savedData.qr;
    img.style.display = "block";
    document.getElementById("btn-lock-qr").style.display = "none";
    document.getElementById("lock-qr-tag").classList.add("active");
  }
}

// स्थायी लॉक (Permanent Lock) फंक्शन
function lockField(type) {
  var savedData = JSON.parse(localStorage.getItem("permanent_payout_details") || "{}");

  if (type === 'UPI') {
    var val = document.getElementById("upi-val").value.trim();
    if (!val || !val.includes("@")) {
      alert("⚠️ कृपया सही UPI ID दर्ज करें (उदा. username@paytm)");
      return;
    }
    if (confirm("⚠️ क्या आप सुनिश्चित हैं? यह UPI ID (" + val + ") स्थायी रूप से लॉक हो जाएगी और दोबारा बदली नहीं जा सकेगी।")) {
      savedData.upi = val;
      localStorage.setItem("permanent_payout_details", JSON.stringify(savedData));
      loadLockedDetails();
      alert("🔒 आपकी UPI ID सुरक्षित रूप से लॉक कर दी गई है!");
    }
  }

  if (type === 'BANK') {
    var h = document.getElementById("bank-holder").value.trim();
    var a = document.getElementById("bank-acc").value.trim();
    var i = document.getElementById("bank-ifsc").value.trim();

    if (!h || !a || !i) {
      alert("⚠️ कृपया बैंक का पूरा विवरण (नाम, खाता संख्या और IFSC) भरें।");
      return;
    }
    if (confirm("⚠️ क्या आप सुनिश्चित हैं? बैंक खाता (" + a + ") हमेशा के लिए लॉक हो जाएगा और दोबारा बदला नहीं जा सकेगा।")) {
      savedData.bank = { holder: h, acc: a, ifsc: i };
      localStorage.setItem("permanent_payout_details", JSON.stringify(savedData));
      loadLockedDetails();
      alert("🔒 आपका बैंक खाता सुरक्षित रूप से लॉक कर दिया गया है!");
    }
  }

  if (type === 'QR') {
    var f = document.getElementById("qr-file");
    if (!f.files || f.files.length === 0) {
      alert("⚠️ कृपया अपना QR कोड फोटो चुनें।");
      return;
    }
    if (confirm("⚠️ क्या आप सुनिश्चित हैं? यह QR कोड स्थायी रूप से लॉक हो जाएगा।")) {
      var reader = new FileReader();
      reader.onload = function(e) {
        savedData.qr = e.target.result;
        localStorage.setItem("permanent_payout_details", JSON.stringify(savedData));
        loadLockedDetails();
        alert("🔒 आपका QR कोड सुरक्षित रूप से लॉक कर दिया गया है!");
      };
      reader.readAsDataURL(f.files[0]);
    }
  }
}

// विड्रॉल सबमिट करना
function submitWithdraw() {
  var amt = parseInt(document.getElementById("withdraw-amt").value);

  // 1. मिनिमम ₹100 की जांच
  if (isNaN(amt) || amt < 100) {
    alert("⚠️ न्यूनतम विड्रॉल ₹100 है। कृपया ₹100 या उससे अधिक अमाउंट दर्ज करें।");
    return;
  }

  // 2. वॉलेट बैलेंस की जांच
  var currentBal = parseInt(localStorage.getItem("main_balance") || "0");
  if (currentBal < amt) {
    alert("❌ अपर्याप्त बैलेंस!\n\nआपके वॉलेट में केवल ₹" + currentBal + " हैं। आप ₹" + amt + " का विड्रॉल नहीं कर सकते।");
    return;
  }

  // 3. चुने गए पेमेंट मेथड की जांच
  var choice = document.querySelector('input[name="payout_choice"]:checked').value;
  var savedData = JSON.parse(localStorage.getItem("permanent_payout_details") || "{}");
  var payoutInfo = "";

  if (choice === 'UPI') {
    if (!savedData.upi) {
      alert("⚠️ पहले अपनी UPI ID दर्ज करके 'Save & Permanent Lock' बटन दबाएँ!");
      return;
    }
    payoutInfo = "UPI: " + savedData.upi;
  } else if (choice === 'BANK') {
    if (!savedData.bank) {
      alert("⚠️ पहले अपना बैंक खाता दर्ज करके 'Save & Permanent Lock' बटन दबाएँ!");
      return;
    }
    payoutInfo = "BANK: " + savedData.bank.acc + " (" + savedData.bank.ifsc + ")";
  } else if (choice === 'QR') {
    if (!savedData.qr) {
      alert("⚠️ पहले अपना QR कोड अपलोड करके 'Save & Permanent Lock' बटन दबाएँ!");
      return;
    }
    payoutInfo = "QR Code Attached";
  }

  if (confirm("क्या आप ₹" + amt + " का विड्रॉल (" + choice + ") पर लगाना चाहते हैं?")) {
    // बैलेंस काटना
    currentBal -= amt;
    localStorage.setItem("main_balance", currentBal);

    // एडमिन के लिए विड्रॉल रिक्वेस्ट सेव करना
    var allWithdraws = JSON.parse(localStorage.getItem("withdraw_requests") || "[]");
    allWithdraws.unshift({
      id: "WD" + new Date().getTime(),
      user: localStorage.getItem("user_name") || "Player",
      amount: amt,
      method: choice,
      payoutDetails: payoutInfo,
      qrImage: (choice === 'QR' ? savedData.qr : null),
      time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
      status: "PENDING"
    });
    localStorage.setItem("withdraw_requests", JSON.stringify(allWithdraws));

    alert("✅ विड्रॉल रिक्वेस्ट सफलतापूर्वक सबमिट हो गई!\n\n₹" + amt + " का भुगतान मात्र 2 से 5 मिनट में आपके खाते में भेज दिया जाएगा।");
    window.location.href = "home.html";
  }
}
</script>
</body>
</html>
