<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saif Ludo - Admin Panel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
body{background:#0b132b;color:#f8fafc;padding:16px;padding-bottom:50px}
.container{max-width:520px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #1c2541;margin-bottom:18px}
.tab-row{display:flex;gap:8px;margin-bottom:16px}
.tab-btn{flex:1;background:#1c2541;color:#94a3b8;border:none;padding:10px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
.tab-btn.active{background:#0284c7;color:#fff}

.card{background:#1c2541;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge-p{background:#eab308;color:#000;font-size:11px;font-weight:900;padding:3px 8px;border-radius:6px}
.ss-preview{width:100%;max-height:200px;object-fit:contain;border-radius:10px;background:#000;margin:8px 0}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-app{flex:1;background:#16a34a;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:800;cursor:pointer}
.btn-rej{flex:1;background:#dc2626;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:800;cursor:pointer}

/* यूजर पेमेंट सेटिंग्स फॉर्म */
.lbl{font-size:12px;font-weight:800;color:#94a3b8;margin:8px 0 4px}
.inp{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:14px;outline:none;margin-bottom:8px}
.btn-save{background:#0284c7;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:8px}
.btn-unlock{background:#fee2e2;color:#ef4444;border:none;padding:10px;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:8px}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="font-size:20px;font-weight:900">🛡️ Saif Ludo Admin</h2>
    <button onclick="window.location.reload()" style="background:#1c2541;color:#fff;border:1px solid #334155;padding:6px 12px;border-radius:8px;cursor:pointer">🔄 Refresh</button>
  </div>

  <div class="tab-row">
    <button class="tab-btn active" id="tb-dep" onclick="showTab('dep')">डिपॉजिट</button>
    <button class="tab-btn" id="tb-wth" onclick="showTab('wth')">विड्रॉल</button>
    <button class="tab-btn" id="tb-user" onclick="showTab('user')">यूजर बैंक/UPI</button>
  </div>

  <!-- 1. डिपॉजिट रिक्वेस्ट -->
  <div id="sec-dep">
    <h3 style="font-size:15px;margin-bottom:12px;color:#38bdf8">पेंडिंग डिपॉजिट</h3>
    <div id="deposit-list"></div>
  </div>

  <!-- 2. विड्रॉल रिक्वेस्ट -->
  <div id="sec-wth" style="display:none">
    <h3 style="font-size:15px;margin-bottom:12px;color:#38bdf8">पेंडिंग विड्रॉल</h3>
    <div id="withdraw-list"></div>
  </div>

  <!-- 3. यूजर पेमेंट विवरण में बदलाव (Admin Edit / Reset) -->
  <div id="sec-user" style="display:none">
    <div class="card">
      <h3 style="font-size:16px;font-weight:900;color:#38bdf8;margin-bottom:6px">⚙️ प्लेयर पेमेंट डिटेल्स बदलें</h3>
      <p style="font-size:12px;color:#94a3b8;margin-bottom:12px">यहाँ से आप प्लेयर की UPI ID, बैंक खाता या QR बदल सकते हैं।</p>

      <div class="lbl">UPI ID:</div>
      <input type="text" id="adm-upi" class="inp" placeholder="उदा. user@paytm">

      <div class="lbl">बैंक खाता धारक का नाम:</div>
      <input type="text" id="adm-holder" class="inp" placeholder="Account Holder Name">

      <div class="lbl">अकाउंट नंबर:</div>
      <input type="number" id="adm-acc" class="inp" placeholder="Account Number">

      <div class="lbl">IFSC कोड:</div>
      <input type="text" id="adm-ifsc" class="inp" placeholder="IFSC Code">

      <div class="lbl">नया QR कोड बदलें:</div>
      <input type="file" id="adm-qr-file" accept="image/*" class="inp" style="padding:6px">
      <img id="adm-qr-view" class="ss-preview" style="display:none">

      <button class="btn-save" onclick="saveUserDetails()">💾 नई डिटेल्स सेव करें</button>
      <button class="btn-unlock" onclick="unlockAllDetails()">🔓 सारा डेटा अनलॉक करें (प्लेयर को फिर से भरने दें)</button>
    </div>
  </div>

</div>

<script>
window.onload = function() {
  loadDeposits();
  loadWithdraws();
  loadUserPayoutData();
};

function showTab(t) {
  ['dep','wth','user'].forEach(function(tab){
    document.getElementById('sec-' + tab).style.display = (tab === t) ? 'block' : 'none';
    document.getElementById('tb-' + tab).classList.toggle('active', tab === t);
  });
}

/* डिपॉजिट लोड */
function loadDeposits() {
  var list = document.getElementById("deposit-list");
  var reqs = JSON.parse(localStorage.getItem("deposit_requests") || "[]").filter(function(r){ return r.status === "PENDING"; });
  if(!reqs.length) { list.innerHTML = "<div style='color:#64748b;text-align:center;padding:20px'>कोई पेंडिंग डिपॉजिट नहीं है।</div>"; return; }
  list.innerHTML = "";
  reqs.forEach(function(r){
    var d = document.createElement("div"); d.className = "card";
    d.innerHTML = `
      <div class="row"><b>👤 ${r.user}</b><span class="badge-p">DEPOSIT</span></div>
      <div class="row"><b style="font-size:20px;color:#22c55e">₹ ${r.amount}</b><span style="font-size:11px;color:#94a3b8">⏰ ${r.time}</span></div>
      <div style="background:#0f172a;padding:8px;border-radius:8px;font-size:13px;font-weight:800;color:#38bdf8;margin:6px 0">UTR: ${r.utr}</div>
      ${r.screenshot ? `<img src="${r.screenshot}" class="ss-preview">` : ''}
      <div class="btn-row">
        <button class="btn-app" onclick="actionDeposit('${r.id}', ${r.amount}, true)">✓ Approve</button>
        <button class="btn-rej" onclick="actionDeposit('${r.id}', ${r.amount}, false)">✗ Reject</button>
      </div>`;
    list.appendChild(d);
  });
}

function actionDeposit(id, amt, ok) {
  var reqs = JSON.parse(localStorage.getItem("deposit_requests") || "[]");
  reqs.forEach(function(r){ if(r.id === id) r.status = ok ? "SUCCESS" : "REJECTED"; });
  localStorage.setItem("deposit_requests", JSON.stringify(reqs));
  if(ok) {
    var bal = parseInt(localStorage.getItem("main_balance") || "0");
    localStorage.setItem("main_balance", bal + amt);
    alert("₹" + amt + " यूजर के वॉलेट में जोड़ दिए गए!");
  } else { alert("रिक्वेस्ट रिजेक्ट कर दी गई।"); }
  loadDeposits();
}

/* विड्रॉल लोड */
function loadWithdraws() {
  var list = document.getElementById("withdraw-list");
  var reqs = JSON.parse(localStorage.getItem("withdraw_requests") || "[]").filter(function(r){ return r.status === "PENDING"; });
  if(!reqs.length) { list.innerHTML = "<div style='color:#64748b;text-align:center;padding:20px'>कोई पेंडिंग विड्रॉल नहीं है।</div>"; return; }
  list.innerHTML = "";
  reqs.forEach(function(r){
    var d = document.createElement("div"); d.className = "card";
    d.innerHTML = `
      <div class="row"><b>👤 ${r.user}</b><span class="badge-p" style="background:#38bdf8">WITHDRAW</span></div>
      <div class="row"><b style="font-size:20px;color:#ef4444">₹ ${r.amount}</b><span style="font-size:11px;color:#94a3b8">⏰ ${r.time}</span></div>
      <div style="background:#0f172a;padding:8px;border-radius:8px;font-size:13px;color:#f8fafc;margin:6px 0"><b>माध्यम:</b> ${r.payoutDetails}</div>
      ${r.qrImage ? `<div style="font-size:11px;color:#94a3b8;margin-top:4px">यूजर का QR कोड:</div><img src="${r.qrImage}" class="ss-preview">` : ''}
      <div class="btn-row">
        <button class="btn-app" onclick="actionWithdraw('${r.id}', ${r.amount}, true)">✓ Payment Done (स्वीकार)</button>
        <button class="btn-rej" onclick="actionWithdraw('${r.id}', ${r.amount}, false)">✗ Reject (रिफंड)</button>
      </div>`;
    list.appendChild(d);
  });
}

function actionWithdraw(id, amt, ok) {
  var reqs = JSON.parse(localStorage.getItem("withdraw_requests") || "[]");
  reqs.forEach(function(r){ if(r.id === id) r.status = ok ? "PAID" : "REJECTED"; });
  localStorage.setItem("withdraw_requests", JSON.stringify(reqs));
  if(!ok) {
    var bal = parseInt(localStorage.getItem("main_balance") || "0");
    localStorage.setItem("main_balance", bal + amt);
    alert("विड्रॉल रिजेक्ट हुआ और ₹" + amt + " यूजर के वॉलेट में वापस रिफंड हो गए।");
  } else { alert("विड्रॉल सफल मार्क किया गया!"); }
  loadWithdraws();
}

/* एडमिन द्वारा प्लेयर डिटेल्स बदलना */
function loadUserPayoutData() {
  var data = JSON.parse(localStorage.getItem("permanent_payout_details") || "{}");
  if(data.upi) document.getElementById("adm-upi").value = data.upi;
  if(data.bank) {
    document.getElementById("adm-holder").value = data.bank.holder || "";
    document.getElementById("adm-acc").value = data.bank.acc || "";
    document.getElementById("adm-ifsc").value = data.bank.ifsc || "";
  }
  if(data.qr) {
    var img = document.getElementById("adm-qr-view");
    img.src = data.qr;
    img.style.display = "block";
  }
}

function saveUserDetails() {
  var data = JSON.parse(localStorage.getItem("permanent_payout_details") || "{}");
  var upi = document.getElementById("adm-upi").value.trim();
  var holder = document.getElementById("adm-holder").value.trim();
  var acc = document.getElementById("adm-acc").value.trim();
  var ifsc = document.getElementById("adm-ifsc").value.trim();
  var qrFile = document.getElementById("adm-qr-file");

  if(upi) data.upi = upi;
  if(acc) data.bank = { holder: holder, acc: acc, ifsc: ifsc };

  function finish() {
    localStorage.setItem("permanent_payout_details", JSON.stringify(data));
    alert("✅ प्लेयर की पेमेंट डिटेल्स एडमिन द्वारा अपडेट कर दी गईं!");
    loadUserPayoutData();
  }

  if(qrFile.files && qrFile.files.length > 0) {
    var reader = new FileReader();
    reader.onload = function(e) {
      data.qr = e.target.result;
      finish();
    };
    reader.readAsDataURL(qrFile.files[0]);
  } else {
    finish();
  }
}

function unlockAllDetails() {
  if(confirm("⚠️ क्या आप प्लेयर की सभी पेमेंट डिटेल्स अनलॉक/डिलीट करना चाहते हैं? इससे प्लेयर फिर से नया UPI, बैंक या QR डाल सकेगा।")) {
    localStorage.removeItem("permanent_payout_details");
    document.getElementById("adm-upi").value = "";
    document.getElementById("adm-holder").value = "";
    document.getElementById("adm-acc").value = "";
    document.getElementById("adm-ifsc").value = "";
    document.getElementById("adm-qr-view").style.display = "none";
    alert("🔓 प्लेयर की पेमेंट डिटेल्स अनलॉक कर दी गईं!");
  }
}
</script>
</body>
</html>
